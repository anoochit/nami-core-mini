name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package archive
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="nami-${TAG_NAME}-${{ matrix.target }}"
          BUILD_DIR="target/${{ matrix.target }}/release"
          STAGING_DIR="dist/${ARCHIVE_NAME}"

          mkdir -p "${STAGING_DIR}"

          # Copy binary executable
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "${BUILD_DIR}/nami.exe" "${STAGING_DIR}/"
          else
            cp "${BUILD_DIR}/nami" "${STAGING_DIR}/"
          fi

          # Copy bundled files and directories
          cp nami.json "${STAGING_DIR}/"
          cp .env.example "${STAGING_DIR}/"

          if [ -d ".skills" ]; then
            cp -r .skills "${STAGING_DIR}/"
          fi

          if [ -d "wiki" ]; then
            cp -r wiki "${STAGING_DIR}/"
          fi

          # Create archive
          mkdir -p release_assets
          cd dist
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a "../release_assets/${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          else
            tar -czvf "../release_assets/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: release_assets/*

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: download_assets

      - name: Flatten assets
        run: |
          mkdir -p release_files
          find download_assets -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
